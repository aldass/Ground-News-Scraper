[project]
name = "ground-news-scraper"
version = "0.1.0"
description = "Scrape Ground News article pages with Playwright"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "aldass", email = "AL.Dass@gmail.com" }]
dependencies = [
    "playwright>=1.65.0",
    "tqdm>=4.70.1",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
